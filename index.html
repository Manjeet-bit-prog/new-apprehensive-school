<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission & ID Card - New Apprehensive Public School, Baruna</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }
        
        /* Header Styling */
        .school-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-bottom: 3px double #004085;
            padding-bottom: 20px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
        }
        .logo-svg {
            width: 75px;
            height: 75px;
            flex-shrink: 0;
        }
        .header-text {
            text-align: center;
        }
        .header-text h1 {
            color: #002752;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .header-text p.address {
            color: #d9534f;
            font-size: 14px;
            font-weight: bold;
            margin-top: 4px;
        }
        .section-title {
            background: #e9ecef;
            padding: 8px 12px;
            font-weight: bold;
            color: #004085;
            margin: 20px 0 15px 0;
            border-left: 4px solid #004085;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        .btn-main {
            width: 100%;
            background-color: #004085;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* EXACT CR-80 HORIZONTAL ID CARD (3.375in x 2.125in) */
        #idCardContainer {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .id-card {
            width: 3.375in;
            height: 2.125in;
            border: 1.5px solid #004085;
            border-radius: 8px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            text-align: left;
            padding: 0;
        }
        .id-card-header {
            background: #004085;
            color: white;
            padding: 4px 6px;
            text-align: center;
        }
        .id-card-header h3 {
            font-size: 9.5pt;
            text-transform: uppercase;
            line-height: 1.1;
            font-weight: 800;
        }
        .id-card-header p {
            font-size: 6.5pt;
            color: #ffda6a;
        }
        .id-card-content {
            display: flex;
            padding: 6px;
            gap: 8px;
        }
        .id-photo-box {
            width: 0.75in;
            text-align: center;
        }
        .id-photo {
            width: 0.75in;
            height: 0.95in;
            border: 1px solid #004085;
            border-radius: 4px;
            object-fit: cover;
        }
        .id-card-body {
            flex: 1;
            font-size: 7pt;
            line-height: 1.25;
        }
        .id-card-body table {
            width: 100%;
            border-collapse: collapse;
        }
        .id-card-body td {
            padding: 1px 0;
            vertical-align: top;
        }
        .id-card-body td.label {
            font-weight: bold;
            color: #004085;
            width: 38%;
        }
        .id-card-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
            padding: 3px 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 6pt;
        }
        .sign-box {
            text-align: center;
        }
        .sign-line {
            border-top: 1px dashed #333;
            width: 45px;
            margin-top: 8px;
        }

        /* PRINT SETTINGS (Exact Inch Output) */
        @media print {
            body * {
                visibility: hidden;
            }
            .id-card, .id-card * {
                visibility: visible;
            }
            .id-card {
                position: absolute;
                left: 0;
                top: 0;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ADMISSION FORM -->
    <div id="formBox">
        <div class="school-header">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="#004085" stroke="#d9534f" stroke-width="3"/>
                <circle cx="50" cy="50" r="40" fill="#ffffff"/>
                <path d="M50 22 L75 35 L50 48 L25 35 Z" fill="#004085"/>
                <path d="M35 42 L35 58 C35 63 65 63 65 58 L65 42" fill="none" stroke="#004085" stroke-width="3"/>
            </svg>
            <div class="header-text">
                <h1>New Apprehensive Public School</h1>
                <p class="address">📍 Baruna, Buxar, Bihar</p>
            </div>
        </div>

        <form id="admissionForm">
            <div class="section-title">1. Student Information</div>
            
            <div class="form-group">
                <label>Student's Full Name *</label>
                <input type="text" id="studentName" required>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Date of Birth *</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="col form-group">
                    <label>Admission Class *</label>
                    <select id="classSelect" required>
                        <option value="">Select Class</option>
                        <option value="Nursery">Nursery</option>
                        <option value="LKG">LKG</option>
                        <option value="UKG">UKG</option>
                        <option value="Class 1">Class 1</option>
                        <option value="Class 2">Class 2</option>
                        <option value="Class 3">Class 3</option>
                        <option value="Class 4">Class 4</option>
                        <option value="Class 5">Class 5</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Father's Name *</label>
                    <input type="text" id="fatherName" required>
                </div>
                <div class="col form-group">
                    <label>Contact Number *</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Student Photo *</label>
                <input type="file" id="photoInput" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Full Address *</label>
                <textarea id="address" rows="2" required></textarea>
            </div>

            <button type="submit" class="btn-main">Generate Student ID Card</button>
        </form>
    </div>

    <!-- GENERATED STUDENT ID CARD (Exact 3.375 x 2.125 inches) -->
    <div id="idCardContainer">
        <h2 style="color: #004085; margin-bottom: 15px;">Student Identity Card</h2>

        <div class="id-card">
            <div class="id-card-header">
                <h3>New Apprehensive Public School</h3>
                <p>Baruna, Buxar, Bihar</p>
            </div>

            <div class="id-card-content">
                <div class="id-photo-box">
                    <img id="idPhoto" class="id-photo" src="" alt="Photo">
                </div>

                <div class="id-card-body">
                    <table>
                        <tr><td class="label">ID No:</td><td><strong id="idNo"></strong></td></tr>
                        <tr><td class="label">Name:</td><td><strong id="idName"></strong></td></tr>
                        <tr><td class="label">Class:</td><td id="idClass"></td></tr>
                        <tr><td class="label">DOB:</td><td id="idDob"></td></tr>
                        <tr><td class="label">Father:</td><td id="idFather"></td></tr>
                        <tr><td class="label">Phone:</td><td id="idPhone"></td></tr>
                    </table>
                </div>
            </div>

            <div class="id-card-footer">
                <div>
                    <p style="color:#d9534f; font-weight:bold;">STUDENT CARD</p>
                </div>
                <div class="sign-box">
                    <div class="sign-line"></div>
                    <p style="font-weight:bold;">Principal</p>
                </div>
            </div>
        </div>

        <button onclick="window.print()" class="btn-main" style="width: 300px; margin-top: 20px; background-color: #28a745;">Print / Download ID Card</button>
    </div>
</div>

<script>
document.getElementById('admissionForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var randomId = 'NAPS-' + Math.floor(1000 + Math.random() * 9000);

    var photoFile = document.getElementById('photoInput').files[0];
    if (photoFile) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('idPhoto').src = e.target.result;
        }
        reader.readAsDataURL(photoFile);
    }

    document.getElementById('idNo').innerText = randomId;
    document.getElementById('idName').innerText = document.getElementById('studentName').value;
    document.getElementById('idClass').innerText = document.getElementById('classSelect').value;
    document.getElementById('idDob').innerText = document.getElementById('dob').value;
    document.getElementById('idFather').innerText = document.getElementById('fatherName').value;
    document.getElementById('idPhone').innerText = document.getElementById('phone').value;

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('idCardContainer').style.display = 'block';
});
</script>

</body>
</html>
