<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission Form - New Apprehensive Public School</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #003366; padding-bottom: 15px; margin-bottom: 20px; }
        .header img { max-width: 90px; height: auto; float: left; }
        .header-text { overflow: hidden; }
        .header h1 { color: #003366; margin: 5px 0; font-size: 24px; text-transform: uppercase; }
        .header p { margin: 3px 0; color: #555; font-size: 14px; }
        .section-title { background: #003366; color: white; padding: 8px 12px; font-weight: bold; margin-top: 25px; margin-bottom: 15px; border-radius: 4px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .form-group input[readonly] { background-color: #e9ecef; font-weight: bold; }
        .btn-container { text-align: center; margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; color: white; }
        .btn-preview { background-color: #17a2b8; }
        .btn-submit { background-color: #28a745; }
        .btn-print { background-color: #0056b3; }
        
        /* Modal Style for Preview */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 80%; max-width: 700px; border-radius: 8px; }
        .close { float: right; font-size: 24px; font-weight: bold; cursor: pointer; }
        
        @media print {
            .btn-container, .close { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

<div class="container" id="printableArea">
    <!-- Header Section -->
    <div class="header">
        <img src="https://via.placeholder.com/90?text=LOGO" alt="School Logo" id="schoolLogo">
        <div class="header-text">
            <h1>New Apprehensive Public School</h1>
            <p><strong>Address:</strong> Baruna, Buxar, Bihar - 802119</p>
            <p><strong>Contact:</strong> +91 9546427830, +91 9304034138</p>
            <h3 style="margin-top: 10px; color: #d9534f;">ONLINE ADMISSION FORM</h3>
        </div>
    </div>

    <form id="admissionForm">
        <!-- Office & Basic Details -->
        <div class="section-title">1. Office & Academic Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Admission No.</label>
                <input type="text" id="admissionNo" placeholder="Auto/Office use">
            </div>
            <div class="form-group">
                <label>Registration No.</label>
                <input type="text" id="registrationNo" placeholder="Auto/Office use">
            </div>
            <div class="form-group">
                <label>Date of Admission *</label>
                <input type="date" id="admissionDate" required>
            </div>
            <div class="form-group">
                <label>Applying for Class *</label>
                <select id="studentClass" required>
                    <option value="">Select Class</option>
                    <option value="Nursery">Nursery</option>
                    <option value="LKG">LKG</option>
                    <option value="UKG">UKG</option>
                    <option value="Class 1">Class 1</option>
                    <option value="Class 2">Class 2</option>
                    <option value="Class 3">Class 3</option>
                    <option value="Class 4">Class 4</option>
                    <option value="Class 5">Class 5</option>
                    <option value="Class 6">Class 6</option>
                    <option value="Class 7">Class 7</option>
                    <option value="Class 8">Class 8</option>
                </select>
            </div>
            <div class="form-group">
                <label>Roll No.</label>
                <input type="text" id="rollNo">
            </div>
        </div>

        <!-- Student Details -->
        <div class="section-title">2. Student Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name of Student *</label>
                <input type="text" id="studentName" required>
            </div>
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Nationality</label>
                <input type="text" id="nationality" value="Indian">
            </div>
            <div class="form-group">
                <label>Caste Category</label>
                <select id="caste">
                    <option value="General">General</option>
                    <option value="OBC">OBC</option>
                    <option value="SC">SC</option>
                    <option value="ST">ST</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Aadhaar Number *</label>
                <input type="text" id="aadhaar" maxlength="12" placeholder="12-digit Aadhaar" required>
            </div>
        </div>

        <!-- Parents Details -->
        <div class="section-title">3. Parents Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Father's Name *</label>
                <input type="text" id="fatherName" required>
            </div>
            <div class="form-group">
                <label>Father's Occupation</label>
                <input type="text" id="fatherOccupation">
            </div>
            <div class="form-group">
                <label>Father's Qualification</label>
                <input type="text" id="fatherQualification">
            </div>
            <div class="form-group">
                <label>Mother's Name *</label>
                <input type="text" id="motherName" required>
            </div>
            <div class="form-group">
                <label>Mother's Occupation</label>
                <input type="text" id="motherOccupation">
            </div>
            <div class="form-group">
                <label>Mother's Qualification</label>
                <input type="text" id="motherQualification">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Full Address *</label>
                <textarea id="address" rows="2" required></textarea>
            </div>
        </div>

        <!-- Fee Structure Section -->
        <div class="section-title">4. Fee Details (Automatic Calculation)</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Admission Fee (₹)</label>
                <input type="number" class="fee-input" id="admissionFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Registration Fee (₹)</label>
                <input type="number" class="fee-input" id="registrationFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Computer Lab Fee (₹)</label>
                <input type="number" class="fee-input" id="computerFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Tie & Belt Fee (₹)</label>
                <input type="number" class="fee-input" id="tieBeltFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Dress Fee (₹)</label>
                <input type="number" class="fee-input" id="dressFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label>Books Fee (₹)</label>
                <input type="number" class="fee-input" id="booksFee" value="0" oninput="calculateTotal()">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label style="color: #d9534f; font-size: 15px;">TOTAL AMOUNT (₹)</label>
                <input type="number" id="totalAmount" value="0" readonly style="font-size: 18px; color: #003366;">
            </div>
        </div>

        <!-- Uploads -->
        <div class="section-title">5. Document Uploads</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Upload Student Photo *</label>
                <input type="file" id="studentPhoto" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Upload Parent/Guardian Signature *</label>
                <input type="file" id="signature" accept="image/*" required>
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-container">
            <button type="button" class="btn btn-preview" onclick="openPreview()">Form Preview</button>
            <button type="button" class="btn btn-submit" onclick="sendToWhatsApp()">Submit on WhatsApp</button>
            <button type="button" class="btn btn-print" onclick="window.print()">Print Form</button>
        </div>
    </form>
</div>

<!-- Preview Modal -->
<div id="previewModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePreview()">&times;</span>
        <h2>Admission Form Preview</h2>
        <hr>
        <div id="previewData" style="line-height: 1.8;"></div>
        <br>
        <button class="btn btn-print" onclick="window.print()">Confirm & Print</button>
    </div>
</div>

<script>
    // Set default today date
    document.getElementById('admissionDate').valueAsDate = new Date();

    // Auto-calculate Total Fees
    function calculateTotal() {
        let inputs = document.querySelectorAll('.fee-input');
        let total = 0;
        inputs.forEach(input => {
            let val = parseFloat(input.value) || 0;
            total += val;
        });
        document.getElementById('totalAmount').value = total;
    }

    // Open Preview Modal
    function openPreview() {
        let name = document.getElementById('studentName').value;
        let sClass = document.getElementById('studentClass').value;
        let dob = document.getElementById('dob').value;
        let father = document.getElementById('fatherName').value;
        let mother = document.getElementById('motherName').value;
        let aadhaar = document.getElementById('aadhaar').value;
        let total = document.getElementById('totalAmount').value;

        if(!name || !sClass || !father) {
            alert("Kripya sabhi zaroori details (Name, Class, Father Name) bharein.");
            return;
        }

        let previewHTML = `
            <p><strong>Student Name:</strong> ${name}</p>
            <p><strong>Class:</strong> ${sClass}</p>
            <p><strong>DOB:</strong> ${dob}</p>
            <p><strong>Father's Name:</strong> ${father}</p>
            <p><strong>Mother's Name:</strong> ${mother}</p>
            <p><strong>Aadhaar No:</strong> ${aadhaar}</p>
            <p><strong>Total Payable Amount:</strong> ₹${total}</p>
        `;
        document.getElementById('previewData').innerHTML = previewHTML;
        document.getElementById('previewModal').style.display = 'block';
    }

    function closePreview() {
        document.getElementById('previewModal').style.display = 'none';
    }

    // Send Form Data to WhatsApp
    function sendToWhatsApp() {
        let schoolPhone = "9546427830"; // Target WhatsApp number

        let name = document.getElementById('studentName').value;
        let sClass = document.getElementById('studentClass').value;
        let dob = document.getElementById('dob').value;
        let father = document.getElementById('fatherName').value;
        let phone = document.getElementById('aadhaar').value;
        let address = document.getElementById('address').value;
        let total = document.getElementById('totalAmount').value;

        if(!name || !sClass || !father) {
            alert("Kripya form poora bharein pehle!");
            return;
        }

        let message = *NEW ADMISSION APPLICATION*%0A +
            *School:* New Apprehensive Public School, Baruna%0A%0A +
            *Student Name:* ${name}%0A +
            *Class:* ${sClass}%0A +
            *DOB:* ${dob}%0A +
            *Father Name:* ${father}%0A +
            *Address:* ${address}%0A +
            *Total Fees:* ₹${total}%0A%0A +
            _Note: Photo and Signature attached on Portal._;

        let whatsappUrl = https://wa.me/91${schoolPhone}?text=${message};
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
