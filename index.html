<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Admission - New Apprehensive Public School, Baruna</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #004085;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #004085;
            font-size: 24px;
            text-transform: uppercase;
        }
        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #004085;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #128c7e;
        }
        @media (max-width: 600px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>New Apprehensive Public School</h1>
        <p>Baruna, Buxar, Bihar | Online Admission Form</p>
    </div>

    <form id="admissionForm">
        <div class="form-group">
            <label for="studentName">Student's Full Name (छात्र का पूरा नाम) *</label>
            <input type="text" id="studentName" required>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="dob">Date of Birth (जन्म तिथि) *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="col form-group">
                <label for="gender">Gender (लिंग) *</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="classSelect">Admission Class (कक्षा) *</label>
                <select id="classSelect" required>
                    <option value="">Select Class</option>
                    <option value="Nursery">Nursery</option>
                    <option value="LKG">LKG</option>
                    <option value="UKG">UKG</option>
                    <option value="Class 1">Class 1</option>
                    <option value="Class 2">Class 2</option>
                    <option value="Class 3">Class 3</option>
                    <option value="Class 4">Class 4</option>
                    <option value="Class 5">Class 5</option>
                </select>
            </div>
            <div class="col form-group">
                <label for="phone">Contact Number (मोबाइल नंबर) *</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10 digits" required>
            </div>
        </div>

        <div class="form-group">
            <label for="fatherName">Father's Name (पिता का नाम) *</label>
            <input type="text" id="fatherName" required>
        </div>

        <div class="form-group">
            <label for="motherName">Mother's Name (माता का नाम) *</label>
            <input type="text" id="motherName" required>
        </div>

        <div class="form-group">
            <label for="address">Full Address (पूरा पता) *</label>
            <textarea id="address" rows="3" required></textarea>
        </div>

        <button type="submit">Submit via WhatsApp</button>
    </form>
</div>

<script>
document.getElementById('admissionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Yahan apna 10-digit WhatsApp mobile number likhein (Jaise: 919876543210)
    var schoolWhatsAppNumber = "9546827830"; 

    var sName = document.getElementById('studentName').value;
    var dob = document.getElementById('dob').value;
    var gender = document.getElementById('gender').value;
    var cls = document.getElementById('classSelect').value;
    var phone = document.getElementById('phone').value;
    var fName = document.getElementById('fatherName').value;
    var mName = document.getElementById('motherName').value;
    var address = document.getElementById('address').value;

    var message = "New Admission Request - New Apprehensive Public School%0A%0A" +
                  "Student Name: " + sName + "%0A" +
                  "DOB: " + dob + "%0A" +
                  "Gender: " + gender + "%0A" +
                  "Class: " + cls + "%0A" +
                  "Father's Name: " + fName + "%0A" +
                  "Mother's Name: " + mName + "%0A" +
                  "Contact: " + phone + "%0A" +
                  "Address: " + address;

    var whatsappURL = "https://wa.me/" + schoolWhatsAppNumber + "?text=" + message;
    window.open(whatsappURL, '_blank');
});
</script>

</body>
</html>
