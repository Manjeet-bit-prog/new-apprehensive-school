<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Admission Form - New Apprehensive Public School</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      padding: 20px;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    .school-header {
      text-align: center;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .school-header h1 {
      color: #007bff;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .school-header p {
      font-size: 14px;
      color: #555;
    }
    .form-section-title {
      background: #e9ecef;
      padding: 8px 12px;
      font-weight: bold;
      color: #333;
      margin: 20px 0 15px 0;
      border-left: 4px solid #007bff;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
    }
    .btn-preview {
      background-color: #17a2b8;
      color: white;
    }
    .btn-print {
      background-color: #007bff;
      color: white;
    }
    /* Modal Styles for Preview */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .modal-content, .modal-content * {
        visibility: visible;
      }
      .modal-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="school-header">
    <h1>NEW APPREHENSIVE PUBLIC SCHOOL</h1>
    <p>Baruna Buxar (Bihar) - 802119</p>
    <p>Contact: 9546827830, 9304034138</p>
  </div>

  <form id="admissionForm">
    <!-- Office Details -->
    <div class="grid-2">
      <div class="form-group">
        <label for="admissionNo">Admission No.</label>
        <input type="text" id="admissionNo" placeholder="Auto-generated / Office use">
      </div>
      <div class="form-group">
        <label for="admissionDate">Admission Date *</label>
        <input type="date" id="admissionDate" required>
      </div>
    </div>

    <!-- Student Details -->
    <div class="form-section-title">Student Details</div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="studentName">Student Full Name *</label>
        <input type="text" id="studentName" required>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth *</label>
        <input type="date" id="dob" required>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label for="caste">Caste (Jaati) *</label>
        <input type="text" id="caste" required>
      </div>
      <div class="form-group">
        <label for="nationality">Nationality *</label>
        <input type="text" id="nationality" value="Indian" required>
      </div>
      <div class="form-group">
        <label for="aadhar">Aadhaar Number *</label>
        <input type="text" id="aadhar" placeholder="12-digit Aadhaar Number" pattern="[0-9]{12}" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="studentPhoto">Upload Student Photo *</label>
        <input type="file" id="studentPhoto" accept="image/*" required>
      </div>
      <div class="form-group">
        <label for="studentSig">Upload Signature *</label>
        <input type="file" id="studentSig" accept="image/*" required>
      </div>
    </div>

    <!-- Parent Details -->
    <div class="form-section-title">Parents Details</div>

    <div class="grid-3">
      <div class="form-group">
        <label for="fatherName">Father's Name *</label>
        <input type="text" id="fatherName" required>
      </div>
      <div class="form-group">
        <label for="fatherPesha">Father's Occupation (Pesha) *</label>
        <input type="text" id="fatherPesha" required>
      </div>
      <div class="form-group">
        <label for="fatherQual">Father's Qualification *</label>
        <input type="text" id="fatherQual" required>
      </div>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label for="motherName">Mother's Name *</label>
        <input type="text" id="motherName" required>
      </div>
      <div class="form-group">
        <label for="motherPesha">Mother's Occupation (Pesha) *</label>
        <input type="text" id="motherPesha" required>
      </div>
      <div class="form-group">
        <label for="motherQual">Mother's Qualification *</label>
        <input type="text" id="motherQual" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="mobileNo">Mobile Number *</label>
        <input type="tel" id="mobileNo" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
      </div>
      <div class="form-group">
        <label for="address">Full Address Details *</label>
        <textarea id="address" rows="2" required placeholder="Village/City, Post, PS, District, Pin Code"></textarea>
      </div>
    </div>

    <!-- Fee Details -->
    <div class="form-section-title">Fee Details</div>

    <div class="grid-3">
      <div class="form-group">
        <label for="admissionFee">Admission Fee (₹)</label>
        <input type="number" id="admissionFee" value="0" oninput="calculateTotal()">
      </div>
      <div class="form-group">
        <label for="registrationFee">Registration Fee (₹)</label>
        <input type="number" id="registrationFee" value="0" oninput="calculateTotal()">
      </div>
      <div class="form-group">
        <label for="totalAmount">Total Amount (₹)</label>
        <input type="number" id="totalAmount" value="0" readonly style="background:#e9ecef; font-weight:bold;">
      </div>
    </div>

    <div class="btn-container">
      <button type="button" class="btn btn-preview" onclick="openPreview()">Preview</button>
      <button type="submit" class="btn btn-submit">Submit</button>
    </div>
  </form>
</div>

<!-- Preview Modal -->
<div class="modal" id="previewModal">
  <div class="modal-content">
    <div class="school-header">
      <h1>NEW APPREHENSIVE PUBLIC SCHOOL</h1>
      <p>Baruna Buxar (Bihar) - 802119 | Contact: 9546827830, 9304034138</p>
      <h3>ADMISSION FORM RECEIPT</h3>
    </div>
    <div id="previewBody"></div>
    <div class="btn-container no-print" style="margin-top:20px;">
      <button class="btn btn-print" onclick="window.print()">Print Receipt</button>
      <button class="btn" style="background:#6c757d; color:white;" onclick="closePreview()">Close</button>
    </div>
  </div>
</div>

<script>
  // Auto Calculate Total Amount
  function calculateTotal() {
    const admFee = parseFloat(document.getElementById('admissionFee').value) || 0;
    const regFee = parseFloat(document.getElementById('registrationFee').value) || 0;
    document.getElementById('totalAmount').value = admFee + regFee;
  }

  // Preview Function
  function openPreview() {
    const previewBody = document.getElementById('previewBody');
    previewBody.innerHTML = `
      <p><strong>Admission No:</strong> ${document.getElementById('admissionNo').value || 'N/A'}</p>
      <p><strong>Admission Date:</strong> ${document.getElementById('admissionDate').value}</p>
      <hr style="margin:10px 0;">
      <p><strong>Student Name:</strong> ${document.getElementById('studentName').value}</p>
      <p><strong>DOB:</strong> ${document.getElementById('dob').value}</p>
      <p><strong>Caste:</strong> ${document.getElementById('caste').value} | <strong>Nationality:</strong> ${document.getElementById('nationality').value}</p>
      <p><strong>Aadhaar No:</strong> ${document.getElementById('aadhar').value}</p>
      <hr style="margin:10px 0;">
      <p><strong>Father's Name:</strong> ${document.getElementById('fatherName').value} (${document.getElementById('fatherPesha').value}, ${document.getElementById('fatherQual').value})</p>
      <p><strong>Mother's Name:</strong> ${document.getElementById('motherName').value} (${document.getElementById('motherPesha').value}, ${document.getElementById('motherQual').value})</p>
      <p><strong>Mobile:</strong> ${document.getElementById('mobileNo').value}</p>
      <p><strong>Address:</strong> ${document.getElementById('address').value}</p>
      <hr style="margin:10px 0;">
      <p><strong>Admission Fee:</strong> ₹${document.getElementById('admissionFee').value}</p>
      <p><strong>Registration Fee:</strong> ₹${document.getElementById('registrationFee').value}</p>
      <p><strong>Total Amount:</strong> <strong>₹${document.getElementById('totalAmount').value}</strong></p>
    `;
    document.getElementById('previewModal').style.display = 'flex';
  }

  function closePreview() {
    document.getElementById('previewModal').style.display = 'none';
  }

  document.getElementById('admissionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    openPreview();
  });
</script>

</body>
</html>
